<div class="settings">
  <div *ngFor="let option of themes; let i=index" class="option-hld mtb-10" [ngClass]="{'active': option.selected}"
    (click)="changeTheme(option)">
    <mat-icon [svgIcon]="option.selected? 'radio_checked': 'radio_unchecked'" class="mr-24"
      [ngClass]="{'radio-checked': option.selected}"></mat-icon>
    <div class="theme-bg-hld" [ngClass]="{'blue': i ===0, 'orange': i!==0}"></div>
  </div>
</div>
