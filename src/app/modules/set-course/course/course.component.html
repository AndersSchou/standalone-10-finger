<div class="courses-page">
  <div class="course-progress">
    <div class="exercise-progress">
      <div class="progress" [ngStyle]="{'width': courseVal.progress + '%'}"></div>
    </div>
    <div class="txt-hld">{{courseVal.progress | number: '1.0-2'}}% {{ "translateComplete" | translate}}</div>
  </div>
  <div class="divider"></div>
  <div>
    <div *ngFor="let course of courseVal.courses; let i=index" class="pt-32" [ngClass]="'course-holder-'+i">
      <div class="course-title" #target>{{course.name}}</div>
      <div class="lesson-counter">{{course.exercises.length}} {{ "translateExercises" | translate }}</div>
      <div class="plr-20">
        <div class="max-h" [ngClass]="{'full-h': course.showAll}">
          <div *ngFor="let exercise of course.exercises; let j=index" class="exercise-hld"
            [ngClass]="{'active': j===activeExerciseIndex && i===activeCourseIndex}">
            <div class="exercise" [ngClass]="'exercise-index-'+j">
              <div class="pos-hld">{{j+1}}</div>
              <div>{{exercise.name}}</div>
              <div class="start-btn" (click)="startExercise(i,j)">
                {{ "translateStart" | translate }}
                <mat-icon svgIcon="rocket" class="ml-10">
                </mat-icon>
              </div>
            </div>
            <div class="exercise-progress">
              <div class="progress" [ngClass]="{'full': exercise.results && exercise.results.length > 0}"></div>
            </div>
          </div>
        </div>
        <!-- <div (click)="showAll(course,target)" class="toggle-view">
        <span *ngIf="!course.showAll">{{ "translateShowAll" | translate }} +{{course.exercises.length - 4}}</span>
        <span *ngIf="course.showAll">{{ "translateShowLess" | translate }}</span>
      </div> -->
      </div>
    </div>
  </div>
</div>
