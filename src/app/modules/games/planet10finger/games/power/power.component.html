<p class="rounds-count">Gennemførte runder: {{ roundsCompleted }} / 5</p>

<!-- Training complete overlay -->
<div class="training-complete-overlay" *ngIf="trainingComplete">
  <p class="training-complete-text">Training Complete!</p>
  <button class="training-close-btn" (click)="close()">Luk</button>
</div>

<ng-container *ngIf="!trainingComplete">
  <p class="key-instruction">
    Hold knapperne nede i {{ holdDuration }} sekund for at fortsætte
  </p>

  <div class="pairs-row">
    <div
      class="key-pair"
      *ngFor="let pair of allPairs; let i = index"
      [class.active]="isPairActive(i)"
      [class.done]="isPairDone(i)"
    >
      <div
        class="key-chip"
        *ngFor="let key of pair"
        [class.held]="isPairActive(i) && isKeyHeld(key)"
      >
        {{ key }}
      </div>
    </div>
  </div>

  <div class="progress-bar-track">
    <div class="progress-bar-fill" [style.width.%]="holdProgress"></div>
  </div>

  <div
    class="round-success"
    [style.visibility]="roundSuccess ? 'visible' : 'hidden'"
  >
    &#10003; Runde gennemført!
  </div>
</ng-container>

<!-- Keyboard + hands -->
<div class="keyboard-hld">
  <div class="hands-hld mr-10">
    <div class="hands-bg left"></div>
  </div>
  <app-vkeyboard></app-vkeyboard>
  <div class="hands-hld ml-10">
    <div class="hands-bg right"></div>
  </div>
</div>
