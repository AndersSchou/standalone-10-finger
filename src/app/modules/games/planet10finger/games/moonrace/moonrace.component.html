<p class="rounds-count">Gennemførte baner: {{ score }}</p>

<p class="key-instruction">Skriv den grønne bogstav for at gennemføre banen</p>

<!-- Training complete overlay -->
<div class="training-complete-overlay" *ngIf="gameOver">
  <p class="training-complete-text">Træning gennemført!</p>
  <div class="result-score">
    Du gennemførte <strong>{{ score }}</strong> udfordring{{
      score === 1 ? "" : "er"
    }}!
  </div>
  <div class="coins-earned" *ngIf="coinsEarned > 0">
    <span class="coin-emoji">🪙</span>
    +{{ coinsEarned }} {{ coinsEarned === 1 ? "coin" : "coins" }}
  </div>
  <div class="button-group">
    <button class="training-close-btn" (click)="restartGame()">
      <div>Spil igen</div>
      <div class="button-cost">🔋 1 🫧 1</div>
    </button>
    <button class="training-close-btn secondary" (click)="close()">Luk</button>
  </div>
</div>

<ng-container *ngIf="!gameOver">
  <div class="timer">{{ timeLeft }}s</div>

  <div class="lanes-container">
    <div
      class="lane"
      *ngFor="let lane of lanes"
      [class.finished]="lane.finished"
      [class.error]="lane.showError"
    >
      <div class="letter-buttons">
        <button
          *ngFor="let letter of lane.displayedLetters"
          class="letter-btn"
          [class.correct]="letter === lane.correctLetter && !lane.finished"
          [class.incorrect]="letter !== lane.correctLetter && !lane.finished"
          [class.finished]="lane.finished"
          disabled
        >
          {{ letter }}
        </button>
      </div>
      <div class="lane-status" *ngIf="lane.finished">✓</div>
    </div>
  </div>
</ng-container>

<!-- Keyboard + hands -->
<div class="keyboard-hld">
  <div class="hands-hld mr-10">
    <div class="finger-indicators left">
      <div
        class="finger-indicator pinky"
        [class.active]="isFingerExpected('left', 'pinky')"
      ></div>
      <div
        class="finger-indicator ring"
        [class.active]="isFingerExpected('left', 'ring')"
      ></div>
      <div
        class="finger-indicator middle"
        [class.active]="isFingerExpected('left', 'middle')"
      ></div>
      <div
        class="finger-indicator index"
        [class.active]="isFingerExpected('left', 'index')"
      ></div>
    </div>
    <div class="hands-bg left"></div>
  </div>
  <app-vkeyboard></app-vkeyboard>
  <div class="hands-hld ml-10">
    <div class="finger-indicators right">
      <div
        class="finger-indicator index"
        [class.active]="isFingerExpected('right', 'index')"
      ></div>
      <div
        class="finger-indicator middle"
        [class.active]="isFingerExpected('right', 'middle')"
      ></div>
      <div
        class="finger-indicator ring"
        [class.active]="isFingerExpected('right', 'ring')"
      ></div>
      <div
        class="finger-indicator pinky"
        [class.active]="isFingerExpected('right', 'pinky')"
      ></div>
    </div>
    <div class="hands-bg right"></div>
  </div>
</div>
