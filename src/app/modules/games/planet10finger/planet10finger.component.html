<div class="planet10finger-bg">
  <div class="games-grid">
    <div class="game-card" (click)="openPopup('power')">
      <mat-icon svgIcon="games" class="game-icon"></mat-icon>
      <span class="game-label">Strøm generations spil</span>
    </div>

    <div class="game-card" (click)="openPopup('headquarters')">
      <mat-icon svgIcon="games" class="game-icon"></mat-icon>
      <span class="game-label">Hovedkvarter</span>
    </div>

    <div class="game-card" (click)="openPopup('oxygen')">
      <mat-icon svgIcon="games" class="game-icon"></mat-icon>
      <span class="game-label">Oxygen spil</span>
    </div>

    <div class="game-card" (click)="openPopup('meteor')">
      <mat-icon svgIcon="games" class="game-icon"></mat-icon>
      <span class="game-label">Meteor spil</span>
    </div>

    <div class="game-card" (click)="openPopup('factory')">
      <mat-icon svgIcon="games" class="game-icon"></mat-icon>
      <span class="game-label">Fabrik spil</span>
    </div>

    <div class="game-card" (click)="openPopup('assembling')">
      <mat-icon svgIcon="games" class="game-icon"></mat-icon>
      <span class="game-label">Samle spil</span>
    </div>
  </div>
</div>

<!-- Game Popup -->
<div class="popup-overlay" *ngIf="activePopup" (click)="closePopup()">
  <div class="popup" (click)="$event.stopPropagation()">
    <button
      class="popup-close"
      *ngIf="activePopup !== 'headquarters'"
      (click)="closePopup()"
    >
      &#x2715;
    </button>

    <!-- F+J hold gate (skipped for headquarters) -->
    <div class="fj-gate" *ngIf="!gameReady && activePopup !== 'headquarters'">
      <div class="fj-title">
        <div>Hold</div>
        <div><kbd>F</kbd> og <kbd>J</kbd></div>
        <div>for at starte</div>
      </div>
      <div class="fj-bar-track">
        <div class="fj-bar-fill" [style.width.%]="holdProgress"></div>
      </div>
      <div class="fj-keyboard-hld">
        <div class="fj-hands-hld mr-10">
          <div class="fj-hands-bg left"></div>
        </div>
        <app-vkeyboard></app-vkeyboard>
        <div class="fj-hands-hld ml-10">
          <div class="fj-hands-bg right"></div>
        </div>
      </div>
    </div>

    <!-- Game content (only rendered after hold completes) -->
    <ng-container *ngIf="gameReady || activePopup === 'headquarters'">
      <app-planet10finger-headquarters
        *ngIf="activePopup === 'headquarters'"
        (gameClose)="closePopup()"
      ></app-planet10finger-headquarters>

      <app-planet10finger-power
        *ngIf="activePopup === 'power'"
        (gameClose)="closePopup()"
      ></app-planet10finger-power>

      <app-planet10finger-oxygen
        *ngIf="activePopup === 'oxygen'"
        (gameClose)="closePopup()"
      ></app-planet10finger-oxygen>

      <app-planet10finger-meteor
        *ngIf="activePopup === 'meteor'"
        (gameClose)="closePopup()"
      ></app-planet10finger-meteor>

      <app-planet10finger-factory
        *ngIf="activePopup === 'factory'"
        (gameClose)="closePopup()"
      ></app-planet10finger-factory>

      <app-planet10finger-assembling
        *ngIf="activePopup === 'assembling'"
        (gameClose)="closePopup()"
      ></app-planet10finger-assembling>
    </ng-container>
  </div>
</div>
